<section class="container py-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold">Contáctanos</h2>
    <p class="text-muted">Agenda tu cita o escríbenos para más información</p>
  </div>


  <div class="row g-4">


    <!-- FORMULARIO -->
    <div class="col-md-7">
      <div class="p-4 shadow rounded bg-white">
        <form>
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
          </div>


          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" placeholder="tu@email.com">
          </div>


          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4" placeholder="Escribe tu mensaje..."></textarea>
          </div>


          <button type="submit" class="btn btn-pink w-100">Enviar mensaje</button>
        </form>
      </div>
    </div>


    <!-- INFO CONTACTO -->
    <div class="col-md-5">
      <div class="p-4 shadow rounded contacto-info h-100">
        <h5 class="mb-3">Información</h5>
        <p><strong>📍 Dirección:</strong> Tu ubicación aquí</p>
        <p><strong>📞 Teléfono:</strong> +57 300 000 0000</p>
        <p><strong>📧 Email:</strong> contacto@tumarca.com</p>
        <p><strong>🕒 Horario:</strong> Lunes a Sábado - 9am a 7pm</p>
      </div>
    </div>


  </div>
</section>
